# This file was created automatically with `myst init --gh-pages` 🪄 💚

name: MyST GitHub Pages Deploy
on:
  push:
    # Runs on pushes targeting the default branch
    branches: [main]
env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  # You may need to change this to `BASE_URL: ''`
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Install MyST Markdown
        run: npm install -g mystmd
      - name: Build HTML Assets 
        run: myst build --html 
      - name: Replace SVG content_type in homework-2.json and show result
        run: |
          grep 'content_type' ./_build/html/homework-2.json || echo "No content_type found before"
          sed -i 's/"content_type":"image\/svg+xml"/"content_type":"image"/g' ./_build/html/homework-2.json
          grep 'content_type' ./_build/html/homework-2.json || echo "No content_type found after"
          grep 'content_type' ./_build/html/homework-1.json || echo "No content_type found before"
          sed -i 's/"content_type":"image\/svg+xml"/"content_type":"image"/g' ./_build/html/homework-2.json
          grep 'content_type' ./_build/html/homework-1.json || echo "No content_type found after"
          grep 'content_type' ./_build/html/homework-2.html || echo "No content_type found before"
          sed -i 's/"content_type":"image\/svg+xml"/"content_type":"image"/g' ./_build/html/homework-2.html
          grep 'content_type' ./_build/html/homework-2.html || echo "No content_type found after"
      - name: Fix base URL for public_html in built assets
        run: |
          python3 -c "
          import os
          base_url = os.environ.get('BASE_URL', '').rstrip('/')
          if base_url:
              count = 0
              for root, dirs, files in os.walk('./_build/html'):
                  for file in files:
                      if file.endswith(('.html', '.json', '.js')):
                          path = os.path.join(root, file)
                          with open(path, 'r', encoding='utf-8', errors='ignore') as f:
                              content = f.read()
                          modified = content.replace('\"/public_html/', f'\"{base_url}/public_html/')
                          modified = modified.replace('href=\"/public_html/', f'href=\"{base_url}/public_html/')
                          if modified != content:
                              count += 1
                              with open(path, 'w', encoding='utf-8') as f:
                                  f.write(modified)
              print(f'Prepended BASE_URL ({base_url}) in {count} built files.')
          "
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
